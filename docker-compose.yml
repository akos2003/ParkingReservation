services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "SuperSecretPassword123!"
    ports:
      - "14333:1433"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=db;Database=ParkingReservationDb;User Id=sa;Password=SuperSecretPassword123!;TrustServerCertificate=True;
    depends_on:
      - db